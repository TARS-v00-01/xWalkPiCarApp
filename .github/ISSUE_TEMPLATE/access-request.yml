name: Request private module access
description: Ask maintainers to approve read access to selected xWalk modules.
title: "[Access request] "
body:
  - type: markdown
    attributes:
      value: |
        Requests are public. Do not include passwords, tokens, private source, or personal contact details.
        Maintainers review each request manually. Approval is limited to the repositories they specify.
        Invitations go to the GitHub account that opens this issue; no access is granted automatically.
  - type: dropdown
    id: area
    attributes:
      label: Project area
      options:
        - Applications and Yocto image tooling
        - Raspberry Pi hardware and firmware
        - Both integrations
        - Individual module
    validations:
      required: true
  - type: textarea
    id: modules
    attributes:
      label: Requested modules
      description: List the repositories you need, or describe the feature you want to work on.
      placeholder: For example, xWalk-rpi5-yocto for imager development.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Intended contribution
      description: Explain what you want to investigate, build, test, or fix.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Contribution process
      options:
        - label: I understand this request is public and does not grant access automatically.
          required: true
        - label: I will keep private source and logs in approved private repositories and pull requests.
          required: true
        - label: I understand maintainers submit accepted fixes through Gerrit before GitHub publication.
          required: true
