name: Request organization membership
description: Ask an owner to approve membership with read access to all private repositories.
title: "[Membership request] "
labels: [membership-request]
body:
  - type: markdown
    attributes:
      value: |
        Requests are public. Do not include passwords, tokens, private source, or personal contact details.
        An organization owner reviews each request before approving it.
        Approval sends a membership invitation to the GitHub account that opens this issue.
        You must accept that invitation before membership and organization-wide read access begin.
  - type: dropdown
    id: area
    attributes:
      label: Project area
      options:
        - Applications and Yocto image tooling
        - Raspberry Pi hardware and firmware
        - Both integrations
        - Individual module
    validations:
      required: true
  - type: textarea
    id: modules
    attributes:
      label: Modules of interest
      description: Describe your area of interest. Approved membership includes all private repositories, not only these modules.
      placeholder: For example, xWalk-rpi5-yocto for imager development.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Intended contribution
      description: Explain what you want to investigate, build, test, or fix.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Contribution process
      options:
        - label: I request organization membership with read access to all private repositories, including documentation.
          required: true
        - label: I will keep private source and logs in private repositories and pull requests.
          required: true
        - label: I understand maintainers submit accepted fixes through Gerrit before GitHub publication.
          required: true
