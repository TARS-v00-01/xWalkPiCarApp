name: Organization membership requests

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/membership-requests.yml
      - .github/scripts/membership_requests.py
      - .github/scripts/tests/test_membership_requests.py
      - .github/ISSUE_TEMPLATE/access-request.yml
      - .github/contributor-access.json

permissions:
  contents: read

concurrency:
  group: membership-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  checks:
    if: >-
      github.repository == 'TARS-v00-01/xWalkPiCarApp' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'issue_comment' ||
       (!github.event.issue.pull_request && github.event.comment.body == '/approve-membership'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Test membership approval boundaries
        run: python3 -m unittest discover -s .github/scripts/tests -v

  readiness:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Check invitation credential without sending invitations
        env:
          XWALK_ORG_MEMBERSHIP_TOKEN: ${{ secrets.XWALK_ORG_MEMBERSHIP_TOKEN }}
        run: python3 .github/scripts/membership_requests.py --check

  invite:
    if: github.event_name == 'issue_comment'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Verify owner approval and invite the request author
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XWALK_ORG_MEMBERSHIP_TOKEN: ${{ secrets.XWALK_ORG_MEMBERSHIP_TOKEN }}
        run: python3 .github/scripts/membership_requests.py
