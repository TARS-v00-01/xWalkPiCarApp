name: xWalkPiCarApp Host Quality
'on':
  push:
    branches:
    - master
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: xwalk-app-host-quality-${{ github.sha }}
  cancel-in-progress: true
jobs:
  preparation:
    name: xWalk Preparation
    runs-on:
    - self-hosted
    - linux
    - x64
    - xwalk-ci
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/checkout-private-submodules
    - name: Validate Gerrit-only publication
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job preparation --check publication
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Validate exact app component gitlinks
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job preparation --check gitlinks
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Reviewed patch whitespace validation
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job preparation --check patch
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Publish quality reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: xwalk-app-preparation-${{ github.sha }}
        path: 'build-host/app-integration-*.log

          build-host/app-integration-*.json

          xWalk-arm64-app/build/ci/reports/

          xWalk-arm64-app/app/build/reports/

          xWalk-pcx86-app/build/ci/reports/'
  xwalk-iw:
    name: xWalk-rpi5-iw
    runs-on:
    - self-hosted
    - linux
    - x64
    - xwalk-ci
    timeout-minutes: 90
    needs:
    - preparation
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/checkout-private-submodules
    - name: Validate Protobuf schema descriptors
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-iw --check schemas
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Publish quality reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: xwalk-app-xwalk-iw-${{ github.sha }}
        path: 'build-host/app-integration-*.log

          build-host/app-integration-*.json

          xWalk-arm64-app/build/ci/reports/

          xWalk-arm64-app/app/build/reports/

          xWalk-pcx86-app/build/ci/reports/'
  xwalk-tool:
    name: xWalk-rpi5-tool
    runs-on:
    - self-hosted
    - linux
    - x64
    - xwalk-ci
    timeout-minutes: 90
    needs:
    - preparation
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/checkout-private-submodules
    - name: Gerrit tooling regression tests
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-tool --check tests
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Review control tests
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-tool --check controls
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Tool shell validation
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-tool --check shellcheck
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Publish quality reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: xwalk-app-xwalk-tool-${{ github.sha }}
        path: 'build-host/app-integration-*.log

          build-host/app-integration-*.json

          xWalk-arm64-app/build/ci/reports/

          xWalk-arm64-app/app/build/reports/

          xWalk-pcx86-app/build/ci/reports/'
  xwalk-python:
    name: xWalk-pcx86-app
    runs-on:
    - self-hosted
    - linux
    - x64
    - xwalk-ci
    timeout-minutes: 90
    needs:
    - preparation
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/checkout-private-submodules
    - name: Prepare Python test environment
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-python --check dependencies
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Validate Python Protobuf bindings
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-python --check schemas
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Run Python host tests
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-python --check tests
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Publish quality reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: xwalk-app-xwalk-python-${{ github.sha }}
        path: 'build-host/app-integration-*.log

          build-host/app-integration-*.json

          xWalk-arm64-app/build/ci/reports/

          xWalk-arm64-app/app/build/reports/

          xWalk-pcx86-app/build/ci/reports/'
  xwalk-android:
    name: xWalk-arm64-app
    runs-on:
    - self-hosted
    - linux
    - x64
    - xwalk-ci
    timeout-minutes: 90
    needs:
    - preparation
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/checkout-private-submodules
    - name: Generate and validate Android Protobuf bindings
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-android --check schemas
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Run provisioning host tests
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-android --check tests
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Build APKs, lint and run JVM tests
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-android --check build
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Publish quality reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: xwalk-app-xwalk-android-${{ github.sha }}
        path: 'build-host/app-integration-*.log

          build-host/app-integration-*.json

          xWalk-arm64-app/build/ci/reports/

          xWalk-arm64-app/app/build/reports/

          xWalk-pcx86-app/build/ci/reports/'
  host-quality-gate:
    name: xWalk Host Quality Gate
    runs-on:
    - self-hosted
    - linux
    - x64
    - xwalk-ci
    needs:
    - xwalk-iw
    - xwalk-tool
    - xwalk-python
    - xwalk-android
    if: always()
    steps:
    - name: Require every module to pass
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: jq --exit-status 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"
