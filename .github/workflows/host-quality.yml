name: xWalkPiCarApp Host Quality
'on':
  push:
    branches:
    - master
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: xwalk-app-host-quality-${{ github.sha }}
  cancel-in-progress: true
jobs:
  preparation:
    name: xWalk Preparation
    runs-on:
    - self-hosted
    - linux
    - x64
    - xwalk-ci
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/checkout-private-submodules
    - name: Validate Gerrit-only publication
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job preparation --check publication
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Validate exact app component gitlinks
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job preparation --check gitlinks
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Reviewed patch whitespace validation
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job preparation --check patch
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Publish quality reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: xwalk-app-preparation-${{ github.sha }}
        path: 'build-host/app-integration-*.log

          build-host/app-integration-*.json

          xWalk-arm64-app/build/ci/reports/*.log

          xWalk-arm64-app/app/build/reports/xwalk-quality/coverage.xml

          xWalk-arm64-app/app/build/reports/lint-results-*.xml

          xWalk-arm64-app/app/build/test-results/**/*.xml

          xWalk-pcx86-app/build/ci/reports/*.log

          xWalk-pcx86-app/build/ci/reports/coverage.xml'
  xwalk-iw:
    name: xWalk-rpi5-iw
    runs-on:
    - self-hosted
    - linux
    - x64
    - xwalk-ci
    timeout-minutes: 90
    needs:
    - preparation
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/checkout-private-submodules
    - name: Validate Protobuf schema descriptors
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-iw --check schemas
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Publish quality reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: xwalk-app-xwalk-iw-${{ github.sha }}
        path: 'build-host/app-integration-*.log

          build-host/app-integration-*.json

          xWalk-arm64-app/build/ci/reports/*.log

          xWalk-arm64-app/app/build/reports/xwalk-quality/coverage.xml

          xWalk-arm64-app/app/build/reports/lint-results-*.xml

          xWalk-arm64-app/app/build/test-results/**/*.xml

          xWalk-pcx86-app/build/ci/reports/*.log

          xWalk-pcx86-app/build/ci/reports/coverage.xml'
  xwalk-tool:
    name: xWalk-rpi5-tool
    runs-on:
    - self-hosted
    - linux
    - x64
    - xwalk-ci
    timeout-minutes: 90
    needs:
    - preparation
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/checkout-private-submodules
    - name: Gerrit tooling regression tests
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-tool --check tests
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Review control tests
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-tool --check controls
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Tool shell validation
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-tool --check shellcheck
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Publish quality reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: xwalk-app-xwalk-tool-${{ github.sha }}
        path: 'build-host/app-integration-*.log

          build-host/app-integration-*.json

          xWalk-arm64-app/build/ci/reports/*.log

          xWalk-arm64-app/app/build/reports/xwalk-quality/coverage.xml

          xWalk-arm64-app/app/build/reports/lint-results-*.xml

          xWalk-arm64-app/app/build/test-results/**/*.xml

          xWalk-pcx86-app/build/ci/reports/*.log

          xWalk-pcx86-app/build/ci/reports/coverage.xml'
  xwalk-python:
    name: xWalk-pcx86-app
    runs-on:
    - self-hosted
    - linux
    - x64
    - xwalk-ci
    timeout-minutes: 90
    needs:
    - preparation
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/checkout-private-submodules
    - name: Prepare Python test environment
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-python --check dependencies
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Validate Python Protobuf bindings
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-python --check schemas
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Run Python host tests
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-python --check tests
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Publish quality reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: xwalk-app-xwalk-python-${{ github.sha }}
        path: 'build-host/app-integration-*.log

          build-host/app-integration-*.json

          xWalk-arm64-app/build/ci/reports/*.log

          xWalk-arm64-app/app/build/reports/xwalk-quality/coverage.xml

          xWalk-arm64-app/app/build/reports/lint-results-*.xml

          xWalk-arm64-app/app/build/test-results/**/*.xml

          xWalk-pcx86-app/build/ci/reports/*.log

          xWalk-pcx86-app/build/ci/reports/coverage.xml'
  xwalk-model:
    name: xWalk-pcx86-model
    runs-on: [self-hosted, linux, x64, xwalk-ci]
    timeout-minutes: 20
    needs: [preparation]
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/checkout-private-submodules
    - name: Prepare model host test environment
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-model --check dependencies .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Validate model Python and notebook syntax
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-model --check syntax .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Run model host regression tests
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-model --check tests .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Publish model quality reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: xwalk-app-model-${{ github.sha }}
        path: build-host/app-integration-xwalk-model*.log
  xwalk-android:
    name: xWalk-arm64-app
    runs-on:
    - self-hosted
    - linux
    - x64
    - xwalk-ci
    timeout-minutes: 90
    needs:
    - preparation
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/checkout-private-submodules
    - name: Generate and validate Android Protobuf bindings
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-android --check schemas
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Run provisioning host tests
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-android --check tests
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Build APKs, lint and run JVM tests
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-android --check build
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Publish quality reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: xwalk-app-xwalk-android-${{ github.sha }}
        path: 'build-host/app-integration-*.log

          build-host/app-integration-*.json

          xWalk-arm64-app/build/ci/reports/*.log

          xWalk-arm64-app/app/build/reports/xwalk-quality/coverage.xml

          xWalk-arm64-app/app/build/reports/lint-results-*.xml

          xWalk-arm64-app/app/build/test-results/**/*.xml

          xWalk-pcx86-app/build/ci/reports/*.log

          xWalk-pcx86-app/build/ci/reports/coverage.xml'
  xwalk-quality:
    name: xWalk Quality
    runs-on:
    - self-hosted
    - linux
    - x64
    - xwalk-ci
    timeout-minutes: 90
    needs:
    - xwalk-python
    - xwalk-android
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/checkout-private-submodules
    - name: Prepare Python quality tools
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-quality --check python-dependencies
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Python static analysis (Ruff)
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-quality --check python-lint
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Python host tests and branch coverage
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-quality --check python-coverage
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Python concurrent response stress
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-quality --check python-stress
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Python bounded malformed-input probes
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-quality --check python-fuzz
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Python retained-memory regression
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-quality --check python-memory
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Java Release build and JVM tests
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-quality --check java-release
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Android Debug and Release static analysis
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-quality --check java-lint
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Java concurrent response stress
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-quality --check java-stress
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Java bounded malformed-input probes
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-quality --check java-fuzz
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Java JaCoCo coverage and regression limits
      run: python3 -B xWalk-rpi5-tool/py-agent/gerrit-tool/py-src/xWalkAppIntegrationCi.py --job xwalk-quality --check java-coverage
        .
      env:
        PYTHONDONTWRITEBYTECODE: '1'
    - name: Publish quality reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: xwalk-app-quality-${{ github.sha }}
        path: 'build-host/app-integration-*.log

          build-host/app-integration-*.json

          xWalk-arm64-app/build/ci/reports/*.log

          xWalk-arm64-app/app/build/reports/xwalk-quality/coverage.xml

          xWalk-arm64-app/app/build/reports/lint-results-*.xml

          xWalk-arm64-app/app/build/test-results/**/*.xml

          xWalk-pcx86-app/build/ci/reports/*.log

          xWalk-pcx86-app/build/ci/reports/coverage.xml'
  host-quality-gate:
    name: xWalk Host Quality Gate
    runs-on:
    - self-hosted
    - linux
    - x64
    - xwalk-ci
    needs:
    - xwalk-iw
    - xwalk-tool
    - xwalk-python
    - xwalk-model
    - xwalk-android
    - xwalk-quality
    if: always()
    steps:
    - name: Require every module to pass
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: jq --exit-status 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"
